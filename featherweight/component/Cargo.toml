[package]
name = "featherweight-component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WIT component-model binding adapter: run wasm components as Isotope blocks"
readme = "README.md"
keywords = ["isotope", "wasm", "component-model", "wit", "runtime"]
categories = ["wasm", "virtualization"]

[dependencies]
featherweight-runtime = { version = "0.2.0", path = "../runtime" }
structfs-core-store = { workspace = true }
structfs-ll-store = { workspace = true }
structfs-serde-store = { workspace = true }
structfs-handles = { workspace = true }
bytes = "1.9"
wasmtime = { workspace = true, default-features = true, features = ["component-model"] }

[dev-dependencies]
tempfile = { workspace = true }

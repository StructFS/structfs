[package]
name = "featherweight-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Guest SDK and reference block for the core-wasm Block ABI binding (isotope/spec/11)"
readme = "README.md"
keywords = ["isotope", "wasm", "guest", "sdk", "store"]
categories = ["wasm", "api-bindings"]

[features]
default = ["reference-guest"]
reference-guest = []
value-codecs = ["dep:structfs-serde-store"]
state = ["value-codecs", "dep:structfs-state"]
profiles = ["value-codecs", "dep:structfs-profiles"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
structfs-serde-store = { workspace = true, optional = true }

structfs-state = { workspace = true, default-features = false, optional = true }
structfs-profiles = { workspace = true, default-features = false, optional = true }

[package]
name = "featherweight-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Strawman Isotope runtime: blocks, assemblies, namespaces, and the /iso store over StructFS"
readme = "README.md"
keywords = ["isotope", "wasm", "runtime", "store", "capability"]
categories = ["wasm", "virtualization", "asynchronous"]

[dependencies]
structfs-core-store = { workspace = true, features = ["async"] }
structfs-ll-store = { workspace = true }
structfs-serde-store = { workspace = true }
structfs-handles = { workspace = true }
structfs-service = { workspace = true }
bytes = "1.9"
async-trait = { workspace = true }

# Minimal engine: the core runtime speaks only the core-wasm binding
# (spec 11). No component-model — the WIT adapter (featherweight-component)
# brings that with its own wasmtime features.
wasmtime = { workspace = true, default-features = false, features = [
    "cranelift",
    "runtime",
    "parallel-compilation",
    "wat",
    "async",
] }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
chrono = "0.4"
thiserror = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
structfs-state = { workspace = true, features = ["service"] }
featherweight-wasi = { version = "0.2.0", path = "../wasi" }
structfs-json-store = { workspace = true }
# Assembles the cross-host fixture guest (tests/transcript.rs); already
# in the graph via wasmtime's wat feature.
wat = "1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

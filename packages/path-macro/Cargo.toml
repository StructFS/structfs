[package]
name = "structfs-path-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Compile-time validated path! macro for StructFS"
readme = "../../README.md"
keywords = ["path", "macro", "identifier", "uax31"]
categories = ["data-structures", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
structfs-path-validation = { workspace = true }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

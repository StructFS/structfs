[package]
name = "structfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A uniform interface for accessing data through read/write operations on paths"
readme = "README.md"
keywords = ["store", "path", "read-write", "mount", "structured-data"]
categories = ["data-structures", "rust-patterns"]

[dependencies]
structfs-core-store = { workspace = true }
structfs-serde-store = { workspace = true, optional = true }
structfs-json-store = { workspace = true, optional = true }
# Workspace entry disables `blocking`, so `net` alone stays portable.
structfs-http = { workspace = true, optional = true }
structfs-sys = { workspace = true, optional = true }
structfs-handles = { workspace = true, optional = true }
structfs-service = { workspace = true, optional = true }
structfs-state = { workspace = true, features = ["service"], optional = true }
structfs-profiles = { workspace = true, features = ["host"], optional = true }

[dev-dependencies]
serde = { workspace = true }

# Every feature below names the facade module it adds, except `async`, which
# adds the async trait families to the root (and to `typed` when enabled).
[features]
default = []
async = ["structfs-core-store/async", "structfs-serde-store?/async"]
typed = ["dep:structfs-serde-store"]
# Implies `typed`: the file backings take `typed::Limits`.
persist = ["typed", "dep:structfs-json-store"]
# Portable HTTP schema: request/response/status types, SSE framing, errors.
net = ["dep:structfs-http"]
# Native blocking HTTP stores over reqwest (not for wasm32).
net-blocking = ["net", "structfs-http/blocking"]
# Native async streaming executor over reqwest.
net-streaming = ["net", "async", "structfs-http/streaming"]
os = ["dep:structfs-sys"]
handles = ["dep:structfs-handles", "async"]
# Implies `handles`: `SupervisedProtocol` wraps a `handles::HandleProtocol`.
service = ["dep:structfs-service", "handles", "async"]
state = ["dep:structfs-state", "service"]
profiles = ["dep:structfs-profiles", "service"]
full = [
    "async",
    "typed",
    "persist",
    "net",
    "net-blocking",
    "net-streaming",
    "os",
    "handles",
    "service",
    "state",
    "profiles",
]

[[example]]
name = "quickstart"

[[example]]
name = "typed_persist"
required-features = ["persist"]

[package.metadata.docs.rs]
all-features = true

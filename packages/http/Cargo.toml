[package]
name = "structfs-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP client stores for StructFS"
readme = "README.md"
keywords = ["store", "http", "client", "broker"]
categories = ["web-programming::http-client"]

[features]
default = ["blocking"]
blocking = ["dep:reqwest", "reqwest/blocking", "dep:structfs-handles", "dep:tokio"]

[dependencies]
structfs-core-store = { workspace = true, features = ["async"] }
structfs-serde-store = { workspace = true }
structfs-handles = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, optional = true }
http = { workspace = true }
url = { workspace = true }
collection_literals = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "time"] }

[dev-dependencies]
wiremock = { workspace = true }

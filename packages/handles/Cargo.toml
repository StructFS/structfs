[package]
name = "structfs-handles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Handle-store and streaming primitives for StructFS: outstanding/{id} scaffolding, bounded duplex byte streams, cancellable parked reads"
readme = "README.md"
keywords = ["store", "handle", "streaming", "async"]
categories = ["asynchronous", "data-structures"]

[dependencies]
structfs-core-store = { workspace = true, features = ["async"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[package]
name = "structfs-serde-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Serde integration for StructFS stores - typed access"
readme = "../../README.md"
keywords = ["store", "serde", "typed", "codec"]
categories = ["data-structures", "encoding"]

[features]
default = []
async = ["async-trait", "structfs-core-store/async"]

[dependencies]
structfs-core-store = { workspace = true }
structfs-ll-store = { workspace = true }
bytes = "1.9"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
async-trait = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

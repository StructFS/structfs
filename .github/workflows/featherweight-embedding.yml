name: Featherweight package embedding
on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'featherweight/**'
      - 'packages/**'
      - 'namecode/**'
      - 'tests/embedding/**'
      - 'scripts/check-featherweight-release*'
      - '.github/workflows/featherweight-embedding.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.*'
      - 'featherweight/**'
      - 'packages/**'
      - 'namecode/**'
      - 'tests/embedding/**'
      - 'scripts/check-featherweight-release*'
      - '.github/workflows/featherweight-embedding.yml'
jobs:
  package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tests/embedding/Cargo.toml -- --check
      - run: scripts/check-featherweight-release.sh

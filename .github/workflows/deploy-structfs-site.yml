name: Deploy structfs.com

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/core-store/**"
      - "packages/serde-store/**"
      - "packages/json_store/**"
      - "packages/ll-store/**"
      - ".github/workflows/deploy-structfs-site.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: structfs_com
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build WASM
        working-directory: site/wasm
        run: wasm-pack build --target web --out-dir ../src/wasm/pkg

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: pnpm exec eleventy

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy site/_site --project-name=structfs-com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

[package]
name = "structfs-portable-consumer-check"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
native = ["structfs-http/blocking", "structfs-handles/sync-bridge"]

[dependencies]
structfs = { version = "0.3.0", path = "../../packages/structfs", default-features = false, features = ["serde", "async"] }
structfs-core-store = { version = "0.3.0", path = "../../packages/core-store", features = ["async"] }
structfs-serde-store = { version = "0.3.0", path = "../../packages/serde-store", features = ["async"] }
structfs-handles = { version = "0.3.0", path = "../../packages/handles", default-features = false }
structfs-http = { version = "0.3.0", path = "../../packages/http", default-features = false }
serde = { version = "1", features = ["derive"] }

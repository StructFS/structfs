[package]
name = "structfs-portable-consumer-check"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
native = ["structfs/net-blocking"]

[dependencies]
# The facade's portable profile: core, async, typed, net (schema only), handles.
structfs = { version = "0.4.0", path = "../../packages/structfs", default-features = false, features = ["typed", "async", "net", "handles"] }
store_core = { package = "structfs-core-store", version = "0.4.0", path = "../../packages/core-store", features = ["async"] }
serde = { version = "1", features = ["derive"] }

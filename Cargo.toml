[workspace]
resolver = "2"
members = [
    "packages/ll-store",
    "packages/path-validation",
    "packages/path-macro",
    "packages/core-store",
    "packages/serde-store",
    "packages/json_store",
    "packages/handles",
    "packages/http",
    "packages/repl",
    "packages/sys",
    "packages/structfs",
    "featherweight",
    "featherweight/runtime",
    "featherweight/guest",
    "namecode",
]
exclude = [
    "namecode/site/wasm",
    "site/wasm",
]

# Exclude WASM-only crates from default builds
# Build featherweight/guest with: cargo component build -p featherweight-guest
default-members = [
    "packages/ll-store",
    "packages/path-validation",
    "packages/path-macro",
    "packages/core-store",
    "packages/serde-store",
    "packages/json_store",
    "packages/handles",
    "packages/http",
    "packages/repl",
    "packages/sys",
    "packages/structfs",
    "featherweight",
    "featherweight/runtime",
    "namecode",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/StructFS/structfs"

[workspace.dependencies]
# Workspace crates - layered architecture
structfs-ll-store = { version = "0.1.0", path = "packages/ll-store" }
structfs-path-validation = { version = "0.1.0", path = "packages/path-validation" }
structfs-path-macro = { version = "0.1.0", path = "packages/path-macro" }
structfs-core-store = { version = "0.1.0", path = "packages/core-store" }
structfs-serde-store = { version = "0.1.0", path = "packages/serde-store" }
namecode = { version = "0.1.1", path = "namecode" }

# Workspace crates - store implementations
structfs-json-store = { version = "0.1.0", path = "packages/json_store" }
structfs-handles = { version = "0.1.0", path = "packages/handles" }
structfs-http = { version = "0.1.0", path = "packages/http" }
structfs-repl = { version = "0.1.0", path = "packages/repl" }
structfs-sys = { version = "0.1.0", path = "packages/sys" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["json", "blocking"] }
http = "1.2"
url = "2.5"

# Error handling
thiserror = "2.0"

# Utilities
lazy_static = "1.5"
collection_literals = "1.0"

# Testing
tempfile = "3.14"
wiremock = "0.6"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }

# CLI/REPL
reedline = "0.44"
nu-ansi-term = "0.50"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"

# Featherweight runtime
wasmtime = "40"
uuid = { version = "1.11", features = ["v4"] }
tracing = "0.1"
wit-bindgen = "0.41"
